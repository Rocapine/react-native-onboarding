name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Before install on purpose: this reads the zod schemas as text and needs no
      # dependencies, so it fails in seconds when the plugin's element docs fall
      # behind the schemas — the drift class the tooling audit kept finding.
      - name: Element docs match the schemas
        run: npm run check:element-docs

      # One release, one version number, across five files. The release skill used
      # to edit the plugin manifest and then not stage it, so the plugin advertised
      # a version it had never been tested against.
      - name: Version identities agree
        run: npm run check:versions

      - name: Install dependencies
        # --ignore-scripts skips native postinstalls (e.g. @shopify/react-native-skia
        # downloads a prebuilt binary from a CDN that intermittently 504s). The build
        # is pure tsc and never needs any native binary.
        run: npm ci --ignore-scripts

      - name: Build headless package
        run: npm run build:headless

      - name: Build UI package
        run: npm run build:ui

      - name: Headless tests type-check
        run: npm run type:check:tests --workspace=packages/onboarding

      - name: Headless tests
        run: npm test --workspace=packages/onboarding

      - name: UI tests
        run: npm test --workspace=packages/onboarding-ui
