name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: packages/onboarding
            name: "@rocapine/react-native-onboarding"
            build: build:headless
          - dir: packages/onboarding-ui
            name: "@rocapine/react-native-onboarding-ui"
            build: build:ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        # --ignore-scripts skips native postinstalls (e.g. @shopify/react-native-skia
        # downloads a prebuilt binary from a CDN that intermittently 504s). Build is
        # pure tsc and publish packs dist/ — neither needs any native binary.
        run: npm ci --ignore-scripts

      - name: Check version vs npm registry
        id: check
        run: |
          LOCAL=$(node -p "require('./${{ matrix.dir }}/package.json').version")
          PUBLISHED=$(npm view ${{ matrix.name }} version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.name }} $LOCAL will be published (registry has $PUBLISHED)"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.name }} $LOCAL already on registry, skipping"
          fi

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        # UI package's tsc resolves @rocapine/react-native-onboarding types
        # from the headless package's dist/, so build headless first.
        run: |
          npm run build:headless
          if [ "${{ matrix.build }}" != "build:headless" ]; then
            npm run ${{ matrix.build }}
          fi

      - name: Publish to npm (OIDC trusted publisher)
        if: steps.check.outputs.should_publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: npm publish --access public

      - name: Tag + GitHub Release
        if: steps.check.outputs.should_publish == 'true' && matrix.dir == 'packages/onboarding'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.local }}
        run: |
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          NOTES=$(awk "/^## \\[?$VERSION\\]?/{flag=1;next}/^## /{flag=0}flag" packages/onboarding/CHANGELOG.md || true)
          if [ -z "$NOTES" ]; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          else
            printf '%s' "$NOTES" | gh release create "$TAG" --title "$TAG" --notes-file -
          fi

  notify-roca-chandler:
    needs: publish
    if: needs.publish.result == 'success'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      # Public repo: checkout and ls-remote read anonymously, so the job
      # needs no token scope. Checks out the pushed commit.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The publish job tags the pushed commit only when it actually published
      # the headless package. A tag at this commit means "a release just shipped".
      - name: Check this push released the headless SDK
        id: release
        run: |
          VERSION=$(node -p "require('./packages/onboarding/package.json').version")
          TAGGED=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)
          if [ "$TAGGED" = "$GITHUB_SHA" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is not tagged at $GITHUB_SHA (no headless release in this push), not notifying roca-chandler"
          fi

      - uses: actions/create-github-app-token@v2
        if: steps.release.outputs.proceed == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.ROCA_CHANDLER_APP_ID }}
          private-key: ${{ secrets.ROCA_CHANDLER_PRIVATE_KEY }}
          owner: Rocapine
          repositories: roca-chandler

      - name: Dispatch sdk-released to roca-chandler
        if: steps.release.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api repos/Rocapine/roca-chandler/dispatches \
            -f event_type=sdk-released \
            -F 'client_payload[sdk]=react-native-onboarding' \
            -F "client_payload[version]=$VERSION"
